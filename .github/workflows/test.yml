name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.12"]
        exclude:
          # Python 3.8 is not published for the current Ubuntu runner; macOS and Windows still cover 3.8.
          - os: ubuntu-latest
            python: "3.8"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Installer tests
        run: python -m unittest discover -s tests -v
      - name: Hook and skill tests
        shell: bash
        run: |
          PYTHON=python bash scripts/test-hooks.sh
          bash scripts/validate-skills.sh
